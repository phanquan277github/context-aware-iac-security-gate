internet_exposure:
  description: >
    Whether objective Terraform or scanner evidence demonstrates
    direct inbound Internet exposure associated with the finding.
    A missing preventive control or unrestricted outbound egress
    alone must not be interpreted as confirmed inbound Internet exposure.
  source:
    - terraform_resource
    - checkov_finding
    - network_configuration
  human_label_derived: false

reachability:
  description: >
    Network reachability relationship associated with the finding.
    The value 'internet' indicates that the finding concerns a
    network path between the affected resource or network boundary
    and the public Internet. It does not by itself imply inbound
    Internet reachability; direction must be preserved in evidence.
  source:
    - terraform_resource
    - network_configuration
    - checkov_finding
  human_label_derived: false

privilege_impact:
  description: >
    Ordinal potential authorization capability granted by the
    Checkov-relevant IAM policy statement. It is derived from
    resolved Effect and Action evidence, not resource breadth,
    effective runtime authorization, or the final human risk label.
    The versioned IAM Action capability taxonomy defines which
    resolved Actions belong to each capability level.
  source:
    - iam_policy
    - checkov_evaluated_statement
  human_label_derived: false
  action_taxonomy: iam_action_capability_taxonomy.yaml
  action_taxonomy_version: d008-v1
  levels:
    "0": >
      No granted capability; the primary supported case is a
      deterministically identified Effect = "Deny" statement.
    "1": >
      Read, list, describe, query, or equivalent observation capability.
    "2": >
      Operational mutation or resource/service-state control that does
      not administer authorization or privilege.
    "3": >
      Privilege administration, delegation, identity/policy/role control,
      or explicitly unrestricted authorization such as Action = "*"
      or iam:*. A non-IAM service wildcard is not level 3 solely
      because it contains a wildcard.
    unknown: >
      Applicable, but the Checkov-relevant statement, Effect, Action,
      or Action capability cannot be determined reliably from static
      evidence. Unresolved Resource scope alone does not cause unknown.
    not_applicable: >
      Privilege impact is not meaningful for this finding according to
      the approved rule applicability matrix.

resource_role:
  description: >
    Functional security role of the affected Terraform resource,
    inferred deterministically from its resource type.
  source:
    - terraform_resource_type
  human_label_derived: false

public_access:
  description: >
    Whether objective configuration evidence confirms public access
    to the affected resource. Missing public-access protection alone
    does not imply public_access=yes.
  source:
    - terraform_resource
    - resource_policy
    - network_configuration
  human_label_derived: false

wildcard_action:
  description: >
    Whether the Checkov-relevant IAM statement contains wildcard
    action syntax such as Action="*", service:*, or another action
    string containing a wildcard character. A long explicit list of
    permissions without wildcard syntax is classified as no.
  source:
    - iam_policy
    - checkov_evaluated_statement
  human_label_derived: false

wildcard_resource:
  description: >
    Whether the Checkov-relevant IAM statement contains a wildcard
    resource value, including Resource="*" or a resource ARN
    containing a wildcard character.
  source:
    - iam_policy
    - checkov_evaluated_statement
  human_label_derived: false

encryption_missing:
  description: >
    Whether the encryption control required by the selected security
    rule is missing or insufficient. For CKV_AWS_145 this specifically
    means that the required KMS-based default encryption control is not
    satisfied and does not necessarily mean that no encryption exists.
  source:
    - checkov_rule
    - terraform_resource
  human_label_derived: false

logging_missing:
  description: >
    Whether the logging or detection control required by the selected
    security rule is missing.
  source:
    - checkov_rule
    - terraform_resource
  human_label_derived: false
